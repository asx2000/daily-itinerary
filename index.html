<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Itinerary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Daily Itinerary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="hdr">
    <small id="date"></small>
    <h1>Today</h1>
    <p id="summary"></p>
    <div class="prog"><i id="barFill"></i></div>
  </header>

  <div id="todo"></div>
  <p id="hint" class="hint" hidden>Hold the dots and drag to reorder. The top task is Up next.</p>
  <p id="empty" class="empty" hidden>Nothing planned yet. Tap + to add your first task.</p>

  <div id="doneWrap" hidden>
    <div class="lab"><span>Done today</span><span id="doneCount"></span></div>
    <div id="done"></div>
  </div>
  <button id="clearAll" class="clear" hidden>Clear all tasks</button>
</main>

<button class="fab" id="openAdd" aria-label="Add task">+</button>

<dialog id="addDialog">
  <form id="addForm" method="dialog">
    <h2 id="dlgTitle">New task</h2>
    <input id="title" required maxlength="80" placeholder="What needs doing?" autocomplete="off">
    <label class="prio"><input id="priority" type="checkbox"> Priority</label>
    <p class="note">New tasks go to the bottom. Drag them up when they matter.</p>
    <div class="actions">
      <button type="button" id="del" class="danger" hidden>Delete</button>
      <button type="button" id="cancel" class="ghost">Cancel</button>
      <button type="submit" class="primary" id="save">Add</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
